<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="250" height="60" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c9a7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16829e" />
      <stop offset="100%" stop-color="#0a2a42" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Enlarged Logo Icon: Futuristic Arena Emblem / Shield Target (Scale 1.25x) -->
  <g transform="translate(4, 3) scale(1.18)">
    <!-- Outer Shield / Hexagon -->
    <path d="M24 3 L44 11 L44 33 C44 42 24 48 24 48 C24 48 4 42 4 33 L4 11 Z" 
          fill="url(#shieldGrad)" stroke="url(#logoGrad)" stroke-width="2.8" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Inner Target / Energy Ring -->
    <circle cx="24" cy="25" r="11" stroke="#00f2fe" stroke-width="2.2" stroke-dasharray="3.5 2" fill="none" />
    
    <!-- Center Spark / Diamond -->
    <polygon points="24,17 30,25 24,33 18,25" fill="url(#logoGrad)" />
    
    <!-- Top Arc / Accent -->
    <path d="M13 16 C18 11 30 11 35 16" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- Logo Text: Clean English SkillArena (Vertically Centered) -->
  <text x="68" y="38" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    Skill<tspan fill="url(#logoGrad)" font-weight="900">Arena</tspan>
  </text>
</svg>
